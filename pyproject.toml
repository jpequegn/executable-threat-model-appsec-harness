[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "executable-appsec-harness"
version = "0.1.0"
description = "Synthetic target, adapters, and analysis for an executable AppSec evaluation harness"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
authors = [{ name = "Julien Pequegnot" }]
dependencies = [
  "duckdb>=1.4,<2",
  "fastapi>=0.116,<1",
  "uvicorn>=0.35,<1",
]

[project.scripts]
appsec-harness-version = "appsec_harness:print_version"
appsec-eval = "appsec_harness.eval.cli:main"
appsec-remediate = "appsec_harness.remediation.cli:main"
appsec-report = "appsec_harness.reporting.cli:main"
appsec-demo = "appsec_harness.demo:main"

[dependency-groups]
dev = [
  "httpx2>=2.12,<3",
  "mypy>=1.17,<2",
  "pytest>=8.4,<10",
  "pytest-cov>=6.2,<8",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/appsec_harness"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers -q"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
branch = true
source = ["appsec_harness"]
omit = ["*/cli.py"]

[tool.coverage.report]
fail_under = 85
show_missing = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["appsec_harness"]
mypy_path = "src"
